development:
  adapter: mysql2
  encoding: utf8mb4
  database: minimalist_development
  username: <%= ENV["MINIMALIST_DATABASE_USER"] %>
  password: <%= ENV["MINIMALIST_DATABASE_PASSWORD"] %>
  pool: 5
  timeout: 5000

test:
  adapter: mysql2
  encoding: utf8mb4
  database: minimalist_test
  username: <%= ENV["MINIMALIST_DATABASE_USER"] %>
  password: <%= ENV["MINIMALIST_DATABASE_PASSWORD"] %>
  pool: 5
  timeout: 5000

# DATABASE_URL takes precedence over the individual production settings.
# Accept mysql:// connection URLs as well as the Rails mysql2:// scheme.
production:
  adapter: mysql2
  encoding: utf8mb4
  url: <%= ENV["DATABASE_URL"]&.sub(/\Amysql:\/\//, "mysql2://").to_json %>
  host: <%= ENV.fetch("MINIMALIST_DATABASE_HOST", "127.0.0.1").to_json %>
  port: <%= ENV.fetch("MINIMALIST_DATABASE_PORT", "3306").to_i %>
  database: <%= ENV.fetch("MINIMALIST_DATABASE_NAME", "minimalist").to_json %>
  username: <%= ENV["MINIMALIST_DATABASE_USER"].to_json %>
  password: <%= ENV["MINIMALIST_DATABASE_PASSWORD"].to_json %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", "5").to_i %>
  connect_timeout: 5
